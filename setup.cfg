[tool:pytest]
addopts = --cov=aiohttp_devtools --cov=tests --cov-report term
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
log_level = INFO
testpaths = tests/
filterwarnings =
    error
    # pytest-forked (1.7.5) leaves the stdout/stderr files of the forked process open, which get garbage
    # collected when pytest's capture replaces sys.stdout/sys.stderr in that process.
    ignore:unclosed file <_io.TextIOWrapper name='.*/std(out|err)' mode='w':ResourceWarning
xfail_strict = true

[flake8]
max-line-length = 120
max-complexity = 10

[bdist_wheel]
python_tag = py310.py311.py312.py313
